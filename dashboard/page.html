<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gross motor screening: tries</title>
<style>
  :root { --bg:#0b0b0c; --panel:#141416; --line:#26262a; --text:#ededed; --dim:#8b8b93;
          --good:#3fb950; --mid:#d29922; --bad:#f85149; --check:#a371f7; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center;
           padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; font-weight:600; }
  .note { color:var(--dim); font-size:12px; }
  .live { margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--good); }
  .dot.off { background:var(--bad); }
  select, button { background:var(--panel); color:var(--text); border:1px solid var(--line);
                   border-radius:6px; padding:5px 10px; font:inherit; }
  button { cursor:pointer; }
  main { padding:20px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr) 380px; }
  @media (max-width: 1000px) { main { grid-template-columns:1fr; } }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px;
           grid-column:1/-1; }
  .card, .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .card { padding:12px 14px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .panel { overflow:hidden; }
  .panel h2 { font-size:13px; margin:0; padding:10px 14px; border-bottom:1px solid var(--line);
              color:var(--dim); font-weight:500; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:8px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  td.reasons { white-space:normal; min-width:220px; color:var(--dim); }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#1b1b1f; }
  tbody tr.sel { background:#1f2430; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px;
          border:1px solid currentColor; }
  .s2 { color:var(--good); } .s1 { color:var(--mid); } .s0 { color:var(--bad); }
  .chk { color:var(--check); }
  .empty { padding:28px 14px; color:var(--dim); text-align:center; }
  canvas { display:block; width:100%; background:#0e0e10; }
  .controls { display:flex; gap:10px; align-items:center; padding:10px 14px;
              border-top:1px solid var(--line); }
  .controls input { flex:1; }
  #detail { padding:10px 14px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
  #detail b { color:var(--text); font-weight:500; }
</style>
</head>
<body>
<header>
  <h1>Gross motor screening: saved tries</h1>
  <select id="run" aria-label="Session"></select>
  <span class="note">Screening aid, reference only, not a diagnosis.</span>
  <span class="live"><span class="dot" id="dot"></span><span id="status">connecting</span></span>
</header>
<main>
  <section class="cards" id="cards"></section>
  <section class="panel">
    <h2>Tries (newest first, click a row to replay)</h2>
    <div class="scroll"><table>
      <thead><tr><th>Time</th><th>Child</th><th>Age (mo)</th><th>Task</th><th>Try</th><th>Leg</th>
        <th>Score</th><th>Conf.</th><th>Corrected</th><th>Dur. (s)</th><th>Reasons</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="empty" id="empty" hidden></div>
  </section>
  <section class="panel">
    <h2 id="replayTitle">Replay</h2>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="controls">
      <button id="play">Pause</button>
      <input id="seek" type="range" min="0" max="0" value="0" aria-label="Frame">
      <span id="clock">0.0 s</span>
    </div>
    <div id="detail">Click a try to see the stick figure.</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let info = null, rows = [], selected = null, cur = null, frame = 0, playing = true, t0 = 0;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async path => { const r = await fetch(path); if (!r.ok) throw new Error(r.status); return r.json(); };

function scoreCell(r) {
  if (r.check_by_teacher === "1") return '<span class="pill chk">check by teacher</span>';
  return `<span class="pill s${esc(r.score)}">${esc(r.score)} ${esc(info.labels[r.score] ?? "")}</span>`;
}

function render() {
  const n = rows.length, checks = rows.filter(r => r.check_by_teacher === "1").length;
  const kids = new Set(rows.map(r => r.child)).size;
  const corrected = rows.filter(r => r.corrected === "1").length;
  const perTask = [1, 2, 3].map(t => rows.filter(r => r.task == t).length).join(" / ");
  $("cards").innerHTML = [["Tries", n], ["Children", kids], ["Task 1 / 2 / 3", perTask],
    ["Check by teacher", checks], ["Task guess corrected", corrected]]
    .map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  $("rows").innerHTML = rows.slice().reverse().map(r => `
    <tr data-f="${esc(r.json_file)}" class="${r.json_file === selected ? "sel" : ""}">
      <td>${esc((r.time || "").slice(11))}</td><td>${esc(r.child)}</td><td>${esc(r.age_months)}</td>
      <td>${esc(r.task)} ${esc(info.tasks[r.task] ?? "")}</td><td>${esc(r.try)}</td><td>${esc(r.leg)}</td>
      <td>${scoreCell(r)}</td><td>${esc(r.confidence)}</td><td>${r.corrected === "1" ? "yes" : ""}</td>
      <td>${esc(r.duration_s)}</td><td class="reasons">${esc(r.reasons)}</td></tr>`).join("");
  $("empty").hidden = n > 0;
  $("empty").textContent = info.runs.length ? "No tries in this session yet."
    : "No session found. Run the app first, for example: python -m app.main --fake";
}

async function refresh() {
  try {
    info = await api("/api/info");
    const sel = $("run"), keep = sel.value;
    sel.innerHTML = info.runs.map(r => `<option value="${esc(r)}">${r === "." ? "(runs folder)" : esc(r)}</option>`).join("");
    if (info.runs.includes(keep)) sel.value = keep;
    rows = sel.value ? await api("/api/log?run=" + encodeURIComponent(sel.value)) : [];
    render();
    $("dot").className = "dot";
    $("status").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("dot").className = "dot off";
    $("status").textContent = "dashboard stopped (run python -m dashboard again)";
  }
}

async function openTry(file) {
  selected = file; render();
  const r = rows.find(x => x.json_file === file);
  try {
    cur = await api(`/api/try?run=${encodeURIComponent($("run").value)}&file=${encodeURIComponent(file)}`);
  } catch (e) { $("detail").textContent = "Could not load this try."; return; }
  frame = 0; playing = true; t0 = performance.now(); $("play").textContent = "Pause";
  $("seek").max = cur.t.length - 1;
  $("replayTitle").textContent = `Replay: ${r.child}, task ${r.task}, try ${r.try}, leg ${r.leg}`;
  const ev = cur.events.map(e => `${(+e.start_s).toFixed(1)}-${(+e.end_s).toFixed(1)} s ${esc(e.state)}`).join(" · ");
  const cl = Object.entries(cur.clues).map(([k, v]) => `${esc(k)} <b>${typeof v === "number" ? v.toFixed(2) : esc(v)}</b>`).join(" · ");
  $("detail").innerHTML = (ev ? `<div>Moments: ${ev}</div>` : "") + (cl ? `<div>Clues: ${cl}</div>` : "") || "No moments or clues saved.";
}

function draw() {
  const cv = $("cv"), g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  if (cur) {
    if (playing) {  // follow the saved time stamps, loop at the end
      const dur = cur.t[cur.t.length - 1] || 1, s = ((performance.now() - t0) / 1000) % (dur + 0.5);
      frame = cur.t.findIndex(x => x >= s); if (frame < 0) frame = cur.t.length - 1;
      $("seek").value = frame;
    }
    const k = Math.min(cv.width / cur.width, cv.height / cur.height), p = cur.points[frame];
    const ok = i => p[i][2] > 0.05;
    g.lineWidth = 3; g.lineCap = "round"; g.strokeStyle = "#58a6ff";
    for (const [a, b] of info.bones) if (ok(a) && ok(b)) {
      g.beginPath(); g.moveTo(p[a][0] * k, p[a][1] * k); g.lineTo(p[b][0] * k, p[b][1] * k); g.stroke();
    }
    g.fillStyle = "#ededed";
    p.forEach((q, i) => { if (ok(i)) { g.beginPath(); g.arc(q[0] * k, q[1] * k, 3, 0, 7); g.fill(); } });
    $("clock").textContent = cur.t[frame].toFixed(1) + " s";
  }
  requestAnimationFrame(draw);
}

$("rows").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) openTry(tr.dataset.f); });
$("run").addEventListener("change", () => { selected = null; cur = null; refresh(); });
$("play").addEventListener("click", () => {
  playing = !playing; $("play").textContent = playing ? "Pause" : "Play";
  if (playing && cur) t0 = performance.now() - cur.t[frame] * 1000;
});
$("seek").addEventListener("input", e => { playing = false; $("play").textContent = "Play"; frame = +e.target.value; });

refresh(); setInterval(refresh, 2000); draw();
</script>
</body>
</html>
